<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Club J6 Fit</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
  }
  #app { max-width: 380px; margin: 0 auto; }
  .card {
    background: #1c1c1c;
    border-radius: 12px;
    padding: 24px 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .card p.title { color: #fff; font-weight: 600; font-size: 17px; margin: 0; }
  .card p.subtitle { color: #5b8def; font-size: 12px; margin: 4px 0 0; }
  .box {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 20px;
  }
  label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
  input {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: #173a7a; color: #fff; margin-bottom: 8px; }
  .btn-secondary { background: #eee; color: #333; }
  .error { color: #c0392b; font-size: 13px; margin: 0 0 8px; display: none; }
  .hidden { display: none; }
  .status-badge {
    display: inline-block;
    font-size: 13px;
    padding: 4px 12px;
    border-radius: 6px;
    margin: 8px 0;
  }
  .pagado { background: #d4f7dc; color: #1e7d34; }
  .pendiente { background: #fde9c8; color: #a86a00; }
  #logout-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  #logout-bar button { width: auto; padding: 6px 14px; background: none; color: #173a7a; font-weight: 500; }
  .socio-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 4px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  #global-error-banner {
    display: none;
    background: #fdecea;
    color: #a12622;
    border: 1px solid #f5c6c3;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    margin-bottom: 12px;
    word-break: break-word;
  }
</style>
</head>
<body>

<div id="app">
  <div id="global-error-banner"></div>

  <!-- PANTALLA: LOGIN -->
  <div id="login-screen">
    <div class="card">
      <p class="title">Club J6 Fit</p>
      <p class="subtitle">Control de mensualidades</p>
    </div>
    <div class="box">
      <label>Correo</label>
      <input id="login-email" type="email" placeholder="tucorreo@gmail.com" />
      <label>Contraseña</label>
      <input id="login-pass" type="password" placeholder="••••••••" />
      <p id="login-error" class="error"></p>
      <button class="btn-primary" onclick="login()">Entrar</button>
      <button class="btn-secondary" onclick="show('register-screen')">Crear cuenta de socio</button>
    </div>
  </div>

  <!-- PANTALLA: REGISTRO -->
  <div id="register-screen" class="hidden">
    <div class="box">
      <label>Nombre completo</label>
      <input id="reg-name" type="text" />
      <label>Correo</label>
      <input id="reg-email" type="email" />
      <label>Contraseña</label>
      <input id="reg-pass" type="password" placeholder="mínimo 6 caracteres" />
      <p id="reg-error" class="error"></p>
      <button class="btn-primary" onclick="register()">Crear cuenta</button>
      <button class="btn-secondary" onclick="show('login-screen')">Ya tengo cuenta</button>
    </div>
  </div>

  <!-- PANTALLA: PANEL SOCIO -->
  <div id="socio-screen" class="hidden">
    <div id="logout-bar">
      <p style="font-weight:600;margin:0;">Mi cuenta</p>
      <button onclick="logout()">Salir</button>
    </div>
    <div class="box" style="text-align:center;">
      <p id="socio-name" style="font-weight:600;margin:0;"></p>
      <p id="socio-email" style="font-size:13px;color:#777;margin:4px 0 0;"></p>
      <div id="socio-badge" class="status-badge"></div>
    </div>
  </div>

  <!-- PANTALLA: PANEL ADMIN -->
  <div id="admin-screen" class="hidden">
    <div id="logout-bar">
      <p style="font-weight:600;margin:0;">Panel admin</p>
      <button onclick="logout()">Salir</button>
    </div>
    <div class="box">
      <p style="font-size:13px;color:#777;margin:0 0 10px;">Socios registrados</p>
      <div id="admin-socios-list"></div>
    </div>
  </div>

</div>

<!-- Firebase SDK (versión compat, más simple de leer) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  // ---- CARTEL DE ERRORES VISIBLE (para no depender de la consola) ----
  // Esto va PRIMERO que todo, para atrapar cualquier error incluso si Firebase falla al cargar.
  function showGlobalError(msg) {
    const el = document.getElementById('global-error-banner');
    el.textContent = 'Error: ' + msg;
    el.style.display = 'block';
  }
  window.addEventListener('error', function(e) {
    showGlobalError(e.message);
  });
  window.addEventListener('unhandledrejection', function(e) {
    showGlobalError((e.reason && e.reason.message) ? e.reason.message : String(e.reason));
  });
  console.log('Página cargada correctamente, iniciando Firebase...');

  // ---- CONFIGURACIÓN DE TU PROYECTO FIREBASE ----
  const firebaseConfig = {
    apiKey: "AIzaSyC9DRx8z-URNcT8ylfvsr9zpd1xJB1n9YI",
    authDomain: "j6-fit.firebaseapp.com",
    projectId: "j6-fit",
    storageBucket: "j6-fit.firebasestorage.app",
    messagingSenderId: "809807951619",
    appId: "1:809807951619:web:a0fcb054bf5a83c29d9b36"
  };

  let auth, db;
  try {
    if (typeof firebase === 'undefined') {
      throw new Error('Las librerías de Firebase no cargaron (revisa tu conexión a internet o si algo está bloqueando gstatic.com).');
    }
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
  } catch (e) {
    showGlobalError(e.message);
  }

  // ---- NAVEGACIÓN ENTRE PANTALLAS ----
  function show(id) {
    ['login-screen','register-screen','socio-screen','admin-screen'].forEach(function(s) {
      document.getElementById(s).classList.toggle('hidden', s !== id);
    });
  }

  // ---- LOGIN ----
  function login() {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value.trim();
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    auth.signInWithEmailAndPassword(email, pass)
      .catch(function(err) {
        errEl.textContent = 'Correo o contraseña incorrectos.';
        errEl.style.display = 'block';
      });
    // Si el login es correcto, onAuthStateChanged (más abajo) se encarga de mostrar la pantalla correcta.
  }

  // ---- REGISTRO ----
  function register() {
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-pass').value.trim();
    const errEl = document.getElementById('reg-error');
    errEl.style.display = 'none';

    if (!name) { errEl.textContent = 'Ingresa tu nombre.'; errEl.style.display = 'block'; return; }
    if (pass.length < 6) { errEl.textContent = 'La contraseña debe tener al menos 6 caracteres.'; errEl.style.display = 'block'; return; }

    auth.createUserWithEmailAndPassword(email, pass)
      .then(function(cred) {
        const uid = cred.user.uid;
        // Crea su documento en la colección "socios"
        return db.collection('socios').doc(uid).set({
          nombre: name,
          correo: email,
          estado: 'pendiente',
          monto: 12,
          creado: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function() {
          // Y su registro de rol en "usuarios"
          return db.collection('usuarios').doc(uid).set({
            correo: email,
            rol: 'socio'
          });
        });
      })
      .catch(function(err) {
        errEl.textContent = 'No se pudo crear la cuenta: ' + err.message;
        errEl.style.display = 'block';
      });
  }

  // ---- CERRAR SESIÓN ----
  function logout() {
    auth.signOut();
  }

  // ---- DETECTA SI HAY SESIÓN ACTIVA (esto da la "sesión persistente") ----
  auth.onAuthStateChanged(function(user) {
    if (!user) {
      show('login-screen');
      return;
    }
    // Busca su rol en la colección "usuarios" buscando por CORREO (no por ID de documento,
    // porque los documentos creados a mano en Firestore no usan el UID como ID)
    db.collection('usuarios').where('correo', '==', user.email).limit(1).get()
      .then(function(snapshot) {
        if (snapshot.empty) {
          showGlobalError('No se encontró tu usuario en la colección "usuarios" con el correo ' + user.email + '. Revisa que el campo correo esté escrito exactamente igual.');
          show('login-screen');
          return;
        }
        const rol = snapshot.docs[0].data().rol;
        if (rol === 'admin') {
          cargarPanelAdmin();
        } else {
          cargarPanelSocio(user.uid);
        }
      })
      .catch(function(err) {
        showGlobalError('Firestore: ' + err.message);
        show('login-screen');
      });
  });

  // ---- CARGAR PANEL DE SOCIO ----
  function cargarPanelSocio(uid) {
    db.collection('socios').doc(uid).get().then(function(doc) {
      const data = doc.data() || {};
      document.getElementById('socio-name').textContent = data.nombre || '';
      document.getElementById('socio-email').textContent = data.correo || '';
      const badge = document.getElementById('socio-badge');
      const estado = data.estado || 'pendiente';
      badge.textContent = estado === 'pagado' ? 'Pagado' : 'Pendiente';
      badge.className = 'status-badge ' + (estado === 'pagado' ? 'pagado' : 'pendiente');
      show('socio-screen');
    }).catch(function(err) {
      showGlobalError('Firestore (socio): ' + err.message);
    });
  }

  // ---- CARGAR PANEL DE ADMIN ----
  function cargarPanelAdmin() {
    const list = document.getElementById('admin-socios-list');
    list.innerHTML = 'Cargando...';
    db.collection('socios').get().then(function(snapshot) {
      list.innerHTML = '';
      if (snapshot.empty) {
        list.innerHTML = '<p style="color:#777;font-size:13px;">Aún no hay socios registrados.</p>';
        return;
      }
      snapshot.forEach(function(doc) {
        const d = doc.data();
        const row = document.createElement('div');
        row.className = 'socio-row';
        const estadoTxt = d.estado === 'pagado' ? 'Pagado' : 'Pendiente';
        row.innerHTML = '<span>' + (d.nombre || '(sin nombre)') + '</span><span>' + estadoTxt + '</span>';
        list.appendChild(row);
      });
    }).catch(function(err) {
      showGlobalError('Firestore (admin): ' + err.message);
    });
    show('admin-screen');
  }
</script>

</body>
</html>
